name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: clojure -M:test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.1
        with:
          cli: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache m2 / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            ~/.gitlibs
          key: ${{ runner.os }}-jdk${{ matrix.java }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-jdk${{ matrix.java }}-clj-
      - name: Checkout shitsuke sibling (transitive deps.edn :local/root)
        run: git clone --depth 1 https://github.com/kotoba-lang/shitsuke ../shitsuke
      - name: Checkout liquid-glass-ui sibling (transitive deps.edn :local/root)
        run: git clone --depth 1 https://github.com/kotoba-lang/liquid-glass-ui ../liquid-glass-ui
      - name: Checkout kotoba-ui sibling (deps.edn :local/root)
        run: git clone --depth 1 https://github.com/kotoba-lang/kotoba-ui ../kotoba-ui
      - name: Run tests
        run: clojure -M:test
